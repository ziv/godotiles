name: Release

# On a version tag (created by release-please): build the extension for every platform, commit
# the prebuilt binaries into the tag itself (an off-branch commit on top of the tagged main
# commit, so `main` stays binary-free and local builds never dirty the tree), and attach the
# addon zip to the GitHub release. After this job:
#   - the tag's source archive (GitHub "Download ZIP", Asset Store repository pulls) contains
#     exactly addons/godotiles/** WITH bin/ — see .gitattributes for the export-ignore rules
#   - godotiles-<version>.zip on the release contains the same addons/godotiles/** tree
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/build.sh release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: addons/godotiles/bin/linux-x86_64

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: scripts/build.sh release
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: addons/godotiles/bin/macos

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo build --manifest-path rust/Cargo.toml --release
          New-Item -ItemType Directory -Force addons/godotiles/bin/windows-x86_64 | Out-Null
          Copy-Item rust/target/release/godotiles.dll addons/godotiles/bin/windows-x86_64/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: addons/godotiles/bin/windows-x86_64

  package:
    needs: [ linux, macos, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: addons/godotiles/bin/linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: addons/godotiles/bin/macos
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: addons/godotiles/bin/windows-x86_64

      - name: Verify every library referenced by the .gdextension exists
        run: |
          set -e
          grep -oE 'res://[^"]+' addons/godotiles/godotiles.gdextension | sed 's#res://##' | sort -u | while read -r f; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
            echo "ok: $f"
          done

      - name: Zip addon (addons/godotiles/** only)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          zip -r "godotiles-${VERSION}.zip" addons/godotiles
          unzip -l "godotiles-${VERSION}.zip"
          echo "ASSET=godotiles-${VERSION}.zip" >> "$GITHUB_ENV"

      - name: Commit the binaries into the release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f addons/godotiles/bin
          git commit -m "chore(release): prebuilt binaries for ${GITHUB_REF_NAME}"
          git tag -f "${GITHUB_REF_NAME}"
          git push -f origin "refs/tags/${GITHUB_REF_NAME}"

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}

      - uses: actions/upload-artifact@v4
        with:
          name: addon
          path: ${{ env.ASSET }}
