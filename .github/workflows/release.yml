name: Release

# Build the extension for every platform and publish it for one release tag.
#
# Called by release-please.yml in the same run that creates the release (a tag created with
# GITHUB_TOKEN never fires `on: push: tags`, so cross-workflow triggering does not work), or run
# by hand (workflow_dispatch) to (re)publish binaries for an existing tag.
#
# After this workflow:
#   - godotiles-<version>.zip (addons/godotiles/** with bin/) is attached to the GitHub release
#   - the `asset-store` branch holds the tagged commit + bin/ — a stable ref whose source archive
#     (GitHub "Download ZIP", Asset Store repository pulls) contains the addon with binaries; see
#     .gitattributes for the export-ignore rules. The release tag itself is never rewritten, so
#     release-please keeps a clean view of main.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.1.2)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.1.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/build.sh release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: addons/godotiles/bin/linux-x86_64

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: scripts/build.sh release
      - run: lipo -info addons/godotiles/bin/macos/libgodotiles.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: addons/godotiles/bin/macos

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo build --manifest-path rust/Cargo.toml --release
          New-Item -ItemType Directory -Force addons/godotiles/bin/windows-x86_64 | Out-Null
          Copy-Item rust/target/release/godotiles.dll addons/godotiles/bin/windows-x86_64/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: addons/godotiles/bin/windows-x86_64

  package:
    needs: [ linux, macos, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: addons/godotiles/bin/linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: addons/godotiles/bin/macos
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: addons/godotiles/bin/windows-x86_64

      - name: Verify every library referenced by the .gdextension exists
        run: |
          set -e
          grep -oE 'res://[^"]+' addons/godotiles/godotiles.gdextension | sed 's#res://##' | sort -u | while read -r f; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
            echo "ok: $f"
          done

      - name: Zip addon (addons/godotiles/** only)
        run: |
          VERSION="${TAG#v}"
          zip -r "godotiles-${VERSION}.zip" addons/godotiles
          unzip -l "godotiles-${VERSION}.zip"
          echo "ASSET=godotiles-${VERSION}.zip" >> "$GITHUB_ENV"
        env:
          TAG: ${{ inputs.tag }}

      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: ${{ env.ASSET }}

      - name: Publish the asset-store branch (tagged commit + bin/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --detach "$TAG"
          git add -f addons/godotiles/bin
          git commit -q -m "chore(release): prebuilt binaries for ${TAG}"
          git push -f origin "HEAD:refs/heads/asset-store"
          SHA="$(git rev-parse HEAD)"
          {
            echo "## ${TAG} published"
            echo
            echo "- release asset: \`${ASSET}\`"
            echo "- \`asset-store\` branch: \`${SHA}\` (use this commit for Asset Store repository pulls)"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TAG: ${{ inputs.tag }}

      - uses: actions/upload-artifact@v4
        with:
          name: addon
          path: ${{ env.ASSET }}
